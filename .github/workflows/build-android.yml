name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show build environment
        run: |
          flutter --version
          java -version

      - name: Generate Android and Web project files
        run: |
          flutter create \
            --platforms=android,web \
            --org com.sanjay \
            --project-name travel_expense \
            .

      - name: Restore Firebase configuration
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "GOOGLE_SERVICES_JSON_BASE64 secret is missing."
            exit 1
          fi

          echo "$GOOGLE_SERVICES_JSON_BASE64" \
            | base64 --decode \
            > android/app/google-services.json

          test -s android/app/google-services.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("android/app/google-services.json")
          data = json.loads(path.read_text())

          package_names = [
              client.get("client_info", {})
              .get("android_client_info", {})
              .get("package_name")
              for client in data.get("client", [])
  
