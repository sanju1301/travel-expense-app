name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter and Java versions
        run: |
          flutter --version
          java -version

      - name: Generate Android and Web project files
        run: |
          flutter create \
            --platforms=android,web \
            --org com.sanjay \
            --project-name travel_expense \
            .

      - name: Restore Firebase configuration
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "GOOGLE_SERVICES_JSON_BASE64 secret is missing."
            exit 1
          fi

          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" \
            | base64 --decode \
            > android/app/google-services.json

          if [ ! -s android/app/google-services.json ]; then
            echo "google-services.json was not restored."
            exit 1
          fi

          jq empty android/app/google-services.json

          PACKAGE_FOUND=$(jq -r \
            '.client[].client_info.android_client_info.package_name' \
            android/app/google-services.json \
            | grep -Fx "com.sanjay.travel_expense" || true)

          if [ -z "$PACKAGE_FOUND" ]; then
            echo "google-services.json does not contain:"
            echo "com.sanjay.travel_expense"
            exit 1
          fi

          echo "Firebase configuration restored successfully."

      - name: Restore Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode \
            > android/app/travel-expense-dev.jks

          if [ ! -s android/app/travel-expense-dev.jks ]; then
            echo "Android signing keystore was not restored."
            exit 1
          fi

          echo "Android signing key restored successfully."

      - name: Verify Android keystore
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "ANDROID_KEYSTORE_PASSWORD secret is missing."
            exit 1
          fi

          if [ -z "$ANDROID_KEY_ALIAS" ]; then
            echo "ANDROID_KEY_ALIAS secret is missing."
            exit 1
          fi

          keytool -list \
            -keystore android/app/travel-expense-dev.jks \
            -alias "$ANDROID_KEY_ALIAS" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            > /dev/null

          echo "Android keystore and alias are valid
