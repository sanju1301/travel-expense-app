name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show environment versions
        run: |
          flutter --version
          java -version

      - name: Generate current Flutter platform files
        run: |
          flutter create \
            --platforms=android,web \
            --org com.sanjay \
            --project-name travel_expense \
            .

      - name: Create Supabase client configuration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "${SUPABASE_URL}" ]; then
            echo "SUPABASE_URL secret is missing."
            exit 1
          fi

          if [ -z "${SUPABASE_PUBLISHABLE_KEY}" ]; then
            echo "SUPABASE_PUBLISHABLE_KEY secret is missing."
            exit 1
          fi

          printf "const supabaseUrl = '%s';\nconst supabasePublishableKey = '%s';\n" \
            "${SUPABASE_URL}" \
            "${SUPABASE_PUBLISHABLE_KEY}" \
            > lib/supabase_config.dart

          test -s lib/supabase_config.dart
          echo "Supabase client configuration created."

      - name: Restore Firebase configuration
        env:
          FIREBASE_JSON: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "${FIREBASE_JSON}" ]; then
            echo "GOOGLE_SERVICES_JSON_BASE64 secret is missing."
            exit 1
          fi

          printf '%s' "${FIREBASE_JSON}" \
            | base64 --decode \
            > android/app/google-services.json

          if [ ! -s android/app/google-services.json ]; then
            echo "google-services.json was not restored."
            exit 1
          fi

          jq empty android/app/google-services.json

          jq -e \
            '.client[].client_info.android_client_info.package_name
             | select(. == "com.sanjay.travel_expense")' \
            android/app/google-services.json \
            > /dev/null

          echo "Firebase configuration restored successfully."

      - name: Restore Android signing key
        env:
          KEYSTORE_DATA: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${KEYSTORE_DATA}" ]; then
            echo "ANDROID_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          printf '%s' "${KEYSTORE_DATA}" \
            | base64 --decode \
            > android/app/travel-expense-dev.jks

          if [ ! -s android/app/travel-expense-dev.jks ]; then
            echo "Android signing keystore was not restored."
            exit 1
          fi

          echo "Android signing keystore restored successfully."

      - name: Verify Android signing key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "${KEYSTORE_PASSWORD}" ]; then
            echo "ANDROID_KEYSTORE_PASSWORD secret is missing."
            exit 1
          fi

          if [ -z "${KEY_ALIAS}" ]; then
            echo "ANDROID_KEY_ALIAS secret is missing."
            exit 1
          fi

          keytool -list -v \
            -keystore android/app/travel-expense-dev.jks \
            -alias "${KEY_ALIAS}" \
            -storepass "${KEYSTORE_PASSWORD}" \
            > keystore-info.txt

          grep -E 'Alias name:|SHA1:|SHA256:' keystore-info.txt
          echo "Android signing key verified successfully."

      - name: Create Android signing properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "${KEY_PASSWORD}" ]; then
            echo "ANDROID_KEY_PASSWORD secret is missing."
            exit 1
          fi

          {
            echo "storePassword=${KEYSTORE_PASSWORD}"
            echo "keyPassword=${KEY_PASSWORD}"
            echo "keyAlias=${KEY_ALIAS}"
            echo "storeFile=travel-expense-dev.jks"
          } > android/key.properties

          test -s android/key.properties
          echo "Android signing properties created."

      - name: Configure Google Services plugin
        run: |
          cat > /tmp/add_google_services.py <<'PY'
          from pathlib import Path

          settings_path = Path("android/settings.gradle.kts")
          settings_text = settings_path.read_text(encoding="utf-8")
          plugin_id = 'id("com.google.gms.google-services")'

          if plugin_id not in settings_text:
              marker = "plugins {\n"
              plugin = (
                  '    id("com.google.gms.google-services") '
                  'version "4.4.4" apply false\n'
              )
              if marker not in settings_text:
                  raise SystemExit(
                      "plugins block was not found in android/settings.gradle.kts"
                  )
              settings_text = settings_text.replace(marker, marker + plugin, 1)
              settings_path.write_text(settings_text, encoding="utf-8")

          app_path = Path("android/app/build.gradle.kts")
          app_text = app_path.read_text(encoding="utf-8")

          if plugin_id not in app_text:
              marker = "plugins {\n"
              if marker not in app_text:
                  raise SystemExit(
                      "plugins block was not found in android/app/build.gradle.kts"
                  )
              app_text = app_text.replace(
                  marker,
                  marker + "    " + plugin_id + "\n",
                  1,
              )
              app_path.write_text(app_text, encoding="utf-8")

          print("Google Services plugin configured.")
          PY

          python3 /tmp/add_google_services.py
          grep -n 'com.google.gms.google-services' android/settings.gradle.kts
          grep -n 'com.google.gms.google-services' android/app/build.gradle.kts

      - name: Configure permanent release signing
        run: |
          cat > /tmp/add_release_signing.py <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle.kts")
          text = path.read_text(encoding="utf-8")

          if "import java.util.Properties" not in text:
              text = (
                  "import java.io.FileInputStream\n"
                  "import java.util.Properties\n\n"
                  + text
              )

          loader = """
          val keystoreProperties = Properties()
          val keystorePropertiesFile =
              rootProject.file("key.properties")

          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(
                  FileInputStream(keystorePropertiesFile)
              )
          }

          """

          if "val keystoreProperties = Properties()" not in text:
              marker = "android {\n"
              if marker not in text:
                  raise SystemExit(
                      "android block was not found in android/app/build.gradle.kts"
                  )
              text = text.replace(marker, loader + marker, 1)

          signing_config = """
              signingConfigs {
                  create("release") {
                      keyAlias =
                          keystoreProperties["keyAlias"] as String
                      keyPassword =
                          keystoreProperties["keyPassword"] as String
                      storeFile = file(
                          keystoreProperties["storeFile"] as String
                      )
                      storePassword =
                          keystoreProperties["storePassword"] as String
                  }
              }

          """

          if 'create("release")' not in text:
              marker = "    buildTypes {\n"
              if marker not in text:
                  raise SystemExit(
                      "buildTypes block was not found in android/app/build.gradle.kts"
                  )
              text = text.replace(marker, signing_config + marker, 1)

          debug_signing = (
              'signingConfig = signingConfigs.getByName("debug")'
          )
          release_signing = (
              'signingConfig = signingConfigs.getByName("release")'
          )

          if debug_signing in text:
              text = text.replace(debug_signing, release_signing)

          if release_signing not in text:
              marker = 'getByName("release") {\n'
              if marker not in text:
                  raise SystemExit(
                      "release build type was not found in android/app/build.gradle.kts"
                  )
              text = text.replace(
                  marker,
                  marker + "            " + release_signing + "\n",
                  1,
              )

          path.write_text(text, encoding="utf-8")
          print("Permanent release signing configured.")
          PY

          python3 /tmp/add_release_signing.py
          grep -n 'create("release")' android/app/build.gradle.kts
          grep -n 'signingConfigs.getByName("release")' android/app/build.gradle.kts

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Flutter project
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter tests
        run: flutter test

      - name: Display registered certificate fingerprints
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          keytool -list -v \
            -keystore android/app/travel-expense-dev.jks \
            -alias "${KEY_ALIAS}" \
            -storepass "${KEYSTORE_PASSWORD}" \
            | grep -E 'SHA1:|SHA256:'

      - name: Build signed release APK
        run: |
          cd android
          ./gradlew assembleRelease \
            -x lintVitalAnalyzeRelease \
            --no-daemon
          cd ..

      - name: Locate signed release APK
        run: |
          APK_PATH=$(find . -type f -name "app-release.apk" | head -1)

          if [ -z "${APK_PATH}" ]; then
            echo "app-release.apk was not found."
            exit 1
          fi

          if [ ! -s "${APK_PATH}" ]; then
            echo "app-release.apk is empty."
            exit 1
          fi

          echo "APK_PATH=${APK_PATH}" >> "${GITHUB_ENV}"
          echo "Release APK found at: ${APK_PATH}"
          ls -lh "${APK_PATH}"

      - name: Verify completed APK certificate
        run: |
          BUILD_TOOLS_VERSION=$(ls "${ANDROID_HOME}/build-tools" | sort -V | tail -1)
          APKSIGNER="${ANDROID_HOME}/build-tools/${BUILD_TOOLS_VERSION}/apksigner"

          if [ ! -x "${APKSIGNER}" ]; then
            echo "Android apksigner was not found."
            exit 1
          fi

          "${APKSIGNER}" verify \
            --verbose \
            --print-certs \
            "${APK_PATH}"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: travel-expense-auth-release-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 14
