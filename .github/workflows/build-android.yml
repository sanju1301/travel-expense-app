name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate current Flutter platform files
        run: |
          flutter create \
            --platforms=android,web \
            --org com.sanjay \
            --project-name travel_expense \
            .

      - name: Restore Firebase configuration
        env:
          FIREBASE_JSON: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "${FIREBASE_JSON}" ]; then
            echo "GOOGLE_SERVICES_JSON_BASE64 is missing."
            exit 1
          fi

          printf '%s' "${FIREBASE_JSON}" \
            | base64 --decode \
            > android/app/google-services.json

          test -s android/app/google-services.json
          jq empty android/app/google-services.json

          jq -e \
            '.client[].client_info.android_client_info.package_name
             | select(. == "com.sanjay.travel_expense")' \
            android/app/google-services.json \
            > /dev/null

          echo "Firebase configuration restored."

      - name: Restore signing keystore
        env:
          KEYSTORE_DATA: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${KEYSTORE_DATA}" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is missing."
            exit 1
          fi

          printf '%s' "${KEYSTORE_DATA}" \
            | base64 --decode \
            > android/app/travel-expense-dev.jks

          test -s android/app/travel-expense-dev.jks
          echo "Signing keystore restored."

      - name: Verify signing keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          keytool -list -v \
            -keystore android/app/travel-expense-dev.jks \
            -alias "${KEY_ALIAS}" \
            -storepass "${KEYSTORE_PASSWORD}" \
            > keystore-info.txt

          grep -E 'Alias name:|SHA1:|SHA256:' keystore-info.txt

      - name: Create key properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          {
            echo "storePassword=${KEYSTORE_PASSWORD}"
            echo "keyPassword=${KEY_PASSWORD}"
            echo "keyAlias=${KEY_ALIAS}"
            echo "storeFile=travel-expense-dev.jks"
          } > android/key.properties

      - name: Add Google Services plugin
        run: |
          python3 <<'PY'
          from pathlib import Path

          settings = Path("android/settings.gradle.kts")
          text = settings.read_text(encoding="utf-8")

          if 'id("com.google.gms.google-services")' not in text:
              marker = "plugins {\n"
              plugin = (
                  '    id("com.google.gms.google-services") '
                  'version "4.4.4" apply false\n'
              )

              if marker not in text:
                  raise SystemExit(
                      "plugins block missing in settings.gradle.kts"
                  )

              text = text.replace(marker, marker + plugin, 1)
              settings.write_text(text, encoding="utf-8")

          app = Path("android/app/build.gradle.kts")
          text = app.read_text(encoding="utf-8")

          if 'id("com.google.gms.google-services")' not in text:
              marker = "plugins {\n"

              if marker not in text:
                  raise SystemExit(
                      "plugins block missing in app build.gradle.kts"
                  )

              text = text.replace(
                  marker,
                  marker
                  + '    id("com.google.gms.google-services")\n',
                  1,
              )

              app.write_text(text, encoding="utf-8")

          print("Google Services plugin added.")
          PY

      - name: Configure signing without replacing Gradle file
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle.kts")
          text = path.read_text(encoding="utf-8")

          if "import java.util.Properties" not in text:
              text = (
                  "import java.io.FileInputStream\n"
                  "import java.util.Properties\n\n"
                  + text
              )

          loader = '''
          val keystoreProperties = Properties()
          val keystorePropertiesFile =
              rootProject.file("key.properties")

          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(
                  FileInputStream(keystorePropertiesFile)
              )
          }

          '''

          if "val keystoreProperties = Properties()" not in text:
              marker = "android {\n"

              if marker not in text:
                  raise SystemExit(
                      "android block missing in app build.gradle.kts"
                  )

              text = text.replace(
                  marker,
                  loader + marker,
                  1,
              )

          signing = '''
              signingConfigs {
                  create("release") {
                      keyAlias =
                          keystoreProperties["keyAlias"] as String

                      keyPassword =
                          keystoreProperties["keyPassword"] as String

                      storeFile = file(
                          keystoreProperties["storeFile"] as String
                      )

                      storePassword =
                          keystoreProperties["storePassword"] as String
                  }
              }

          '''

          if 'create("release")' not in text:
              marker = "    buildTypes {\n"

              if marker not in text:
                  raise SystemExit(
                      "buildTypes block missing in app build.gradle.kts"
                  )

              text = text.replace(
                  marker,
                  signing + marker,
                  1,
              )

          debug_line = (
              'signingConfig = '
              'signingConfigs.getByName("debug")'
          )

          release_line = (
              'signingConfig = '
              'signingConfigs.getByName("release")'
          )

          if debug_line in text:
              text = text.replace(
                  debug_line,
                  release_line,
              )
          elif release_line not in text:
              marker = 'getByName("release") {\n'

              if marker not in text:
                  raise SystemExit(
                      "release build type missing."
                  )

              text = text.replace(
                  marker,
                  marker + "            " + release_line + "\n",
                  1,
              )

          path.write_text(text, encoding="utf-8")
          print("Release signing added.")
          PY

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Display registered certificate
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          keytool -list -v \
            -keystore android/app/travel-expense-dev.jks \
            -alias "${KEY_ALIAS}" \
            -storepass "${KEYSTORE_PASSWORD}" \
            | grep -E 'SHA1:|SHA256:'

      - name: Build signed release APK
        run: flutter build apk --release

      - name: Confirm APK exists
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Verify APK certificate
        run: |
          BUILD_TOOLS_VERSION=$(
            ls "${ANDROID_HOME}/build-tools" \
              | sort -V \
              | tail -1
          )

          APKSIGNER="${ANDROID_HOME}/build-tools/${BUILD_TOOLS_VERSION}/apksigner"

          "${APKSIGNER}" verify \
            --verbose \
            --print-certs \
            build/app/outputs/flutter-apk/app-release.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: travel-expense-auth-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
