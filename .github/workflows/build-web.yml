name: Build Flutter Web

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "web/**"
      - "pubspec.yaml"
      - ".github/workflows/build-web.yml"

permissions:
  contents: read

jobs:
  build-web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate web platform
        run: flutter create --platforms=web --org com.sanjay --project-name travel_expense .
      - name: Create Supabase configuration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "${SUPABASE_URL}"
          test -n "${SUPABASE_PUBLISHABLE_KEY}"
          printf "const supabaseUrl='%s';\nconst supabasePublishableKey='%s';\n" "${SUPABASE_URL}" "${SUPABASE_PUBLISHABLE_KEY}" > lib/supabase_config.dart
      - name: Create Firebase Web configuration
        env:
          API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          APP_ID: ${{ secrets.FIREBASE_WEB_APP_ID }}
          SENDER_ID: ${{ secrets.FIREBASE_WEB_MESSAGING_SENDER_ID }}
          PROJECT_ID: ${{ secrets.FIREBASE_WEB_PROJECT_ID }}
          AUTH_DOMAIN: ${{ secrets.FIREBASE_WEB_AUTH_DOMAIN }}
          STORAGE_BUCKET: ${{ secrets.FIREBASE_WEB_STORAGE_BUCKET }}
        run: |
          test -n "${API_KEY}"
          test -n "${APP_ID}"
          test -n "${SENDER_ID}"
          cat > lib/firebase_web_config.dart <<EOF
          import 'package:firebase_core/firebase_core.dart';
          const firebaseWebOptions = FirebaseOptions(
            apiKey: '${API_KEY}',
            appId: '${APP_ID}',
            messagingSenderId: '${SENDER_ID}',
            projectId: '${PROJECT_ID}',
            authDomain: '${AUTH_DOMAIN}',
            storageBucket: '${STORAGE_BUCKET}',
          );
          EOF
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter build web --release
      - uses: actions/upload-artifact@v4
        with:
          name: travel-expense-web
          path: build/web
          if-no-files-found: error
          retention-days: 14
