name: Build Flutter Web

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "lib/**"
      - "web/**"
      - "config/**"
      - "pubspec.yaml"
      - ".github/workflows/build-web.yml"

permissions:
  contents: read

jobs:
  build-web:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate web platform
        run: >
          flutter create
          --platforms=web
          --org com.sanjay
          --project-name travel_expense
          .

      - name: Create Supabase configuration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "${SUPABASE_URL}"
          test -n "${SUPABASE_PUBLISHABLE_KEY}"

          printf "const supabaseUrl='%s';\nconst supabasePublishableKey='%s';\n" \
            "${SUPABASE_URL}" \
            "${SUPABASE_PUBLISHABLE_KEY}" \
            > lib/supabase_config.dart

      - name: Create Firebase Web configuration
        env:
          API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          APP_ID: ${{ secrets.FIREBASE_WEB_APP_ID }}
          SENDER_ID: ${{ secrets.FIREBASE_WEB_MESSAGING_SENDER_ID }}
          PROJECT_ID: ${{ secrets.FIREBASE_WEB_PROJECT_ID }}
          AUTH_DOMAIN: ${{ secrets.FIREBASE_WEB_AUTH_DOMAIN }}
          STORAGE_BUCKET: ${{ secrets.FIREBASE_WEB_STORAGE_BUCKET }}
        run: |
          test -n "${API_KEY}"
          test -n "${APP_ID}"
          test -n "${SENDER_ID}"
          test -n "${PROJECT_ID}"
          test -n "${AUTH_DOMAIN}"

          cat > lib/firebase_web_config.dart <<EOF
          import 'package:firebase_core/firebase_core.dart';

          const firebaseWebOptions = FirebaseOptions(
            apiKey: '${API_KEY}',
            appId: '${APP_ID}',
            messagingSenderId: '${SENDER_ID}',
            projectId: '${PROJECT_ID}',
            authDomain: '${AUTH_DOMAIN}',
            storageBucket: '${STORAGE_BUCKET}',
          );
          EOF

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Flutter project
        run: flutter analyze --no-fatal-infos

      - name: Build Flutter Web without offline cache
        run: flutter build web --release --pwa-strategy=none

      - name: Remove Flutter service-worker cache
        run: |
          rm -f build/web/flutter_service_worker.js
          rm -f build/web/version.json

          python3 <<'PY'
          from pathlib import Path

          index_path = Path("build/web/index.html")
          text = index_path.read_text(encoding="utf-8")

          old_script = '<script src="flutter_bootstrap.js" async></script>'
          new_script = '<script src="flutter_bootstrap.js?v=8" async></script>'

          if old_script in text:
              text = text.replace(old_script, new_script)
          elif "flutter_bootstrap.js?v=8" not in text:
              raise SystemExit(
                  "flutter_bootstrap.js script tag was not found in index.html"
              )

          index_path.write_text(text, encoding="utf-8")
          print("Flutter service-worker cache disabled.")
          PY

      - name: Add announcement and branded icons
        run: |
          mkdir -p build/web/config build/web/icons
          cp config/announcement.json build/web/config/announcement.json
          cp web/favicon.png build/web/favicon.png
          cp web/icons/* build/web/icons/

      - name: Verify generated web package
        run: |
          test -f build/web/index.html
          test -f build/web/main.dart.js
          test -f build/web/config/announcement.json
          test -d build/web/assets
          test -d build/web/icons

          if [ -f build/web/flutter_service_worker.js ]; then
            echo "flutter_service_worker.js still exists."
            exit 1
          fi

          grep -F "flutter_bootstrap.js?v=8" build/web/index.html
          echo "Web package verified without offline cache."

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: travel-expense-web
          path: build/web
          if-no-files-found: error
          retention-days: 14
