name: travel_expense
description: Trip expense app with Firebase authentication
publish_to: "none"
version: 1.0.0+8

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  cloud_firestore: ^6.1.0
  google_sign_in: ^7.2.0
  supabase_flutter: ^2.10.3
  image_picker: ^1.2.4
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.3
  printing: ^5.14.2
  pdf: ^3.11.3
  http: ^1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/travel_expense_icon_1024.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/travel_expense_icon_1024.png"
  min_sdk_android: 24
  adaptive_icon_background: "#071426"
  adaptive_icon_foreground: "assets/icon/travel_expense_icon_1024.png"
  remove_alpha_ios: true
